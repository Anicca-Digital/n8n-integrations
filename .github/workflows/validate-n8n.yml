name: validate-n8n

on:
  pull_request:
    paths:
      - "clients/**/*.json"
      - "shared/**/*.json"
      - "shared/tools/**"
      - ".github/workflows/validate-n8n.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JSON parses
        run: |
          fail=0
          while IFS= read -r f; do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>/dev/null; then
              echo "::error file=$f::Invalid JSON"; fail=1
            fi
          done < <(find clients shared -type f -name '*.json' 2>/dev/null)
          exit $fail

      - name: Check for likely secrets
        run: |
          # Matches real token shapes and non-empty secret-named string values.
          # Credential type names (e.g. hubspotAppToken) and credential id/name pairs are fine.
          pattern='(pat-[a-z0-9]{2,}-[0-9a-f-]{20,}|sk-[A-Za-z0-9]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|[Bb]earer [A-Za-z0-9._-]{20,}|"(password|client_secret|clientSecret|apiKey|api_key|secret|accessToken|refreshToken)": *"[^"=]{6,}")'
          if grep -rnE --include='*.json' "$pattern" clients shared 2>/dev/null | cut -c1-160; then
            echo "::error::Possible secret found in workflow JSON (see matches above). Use credential references only."
            exit 1
          fi
          echo "No likely secrets found."

      - name: Run n8n workflow validator on changed workflows
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fails on ERROR only (the validator exits non-zero on ERROR; --strict is not used).
          # Warnings and notes are printed. Only changed workflow JSON is checked, so
          # pre-existing findings in untouched files do not block unrelated PRs.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- 'clients/**/*.json' 'shared/**/*.json')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No workflow JSON changed; skipping validator."
            exit 0
          fi
          printf 'Validating:\n'; printf '  %s\n' "${files[@]}"
          python3 shared/tools/validate_workflow.py --no-color "${files[@]}"
